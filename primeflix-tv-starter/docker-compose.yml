services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: primeflix
      POSTGRES_USER: primeflix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primeflix -d primeflix"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://primeflix:${POSTGRES_PASSWORD}@db:5432/primeflix
      ADMIN_KEY: ${ADMIN_KEY}
      CODE_PEPPER: ${CODE_PEPPER}
      TOKEN_PEPPER: ${TOKEN_PEPPER}
      DEVICE_PEPPER: ${DEVICE_PEPPER}
      ADMIN_ORIGINS: ${ADMIN_ORIGINS:-http://127.0.0.1:5173}
    ports:
      - '127.0.0.1:8000:8000'
volumes:
  pgdata:
